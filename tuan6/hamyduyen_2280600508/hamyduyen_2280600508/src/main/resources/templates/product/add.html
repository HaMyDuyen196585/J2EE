<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Thêm/Sửa Sản Phẩm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="bg-light">
    <div class="container mt-5 mb-5">
        <a href="/products" class="btn btn-outline-dark mb-4 fw-bold rounded-pill"><i class="fas fa-arrow-left"></i>
            Quay lại</a>

        <div class="card shadow-lg mx-auto border-0 rounded-4" style="max-width: 600px;">
            <div class="card-header bg-primary text-white fw-bold text-center fs-5 rounded-top-4">
                <i class="fas fa-box-open me-2"></i> Thông Tin Sản Phẩm
            </div>
            <div class="card-body p-4">
                <form th:action="@{/products/save}" th:object="${product}" method="post" enctype="multipart/form-data">
                    <input type="hidden" th:field="*{id}">
                    <input type="hidden" th:field="*{image}">

                    <div class="mb-3">
                        <label class="form-label fw-bold">Tên thiết bị / Sản phẩm</label>
                        <input type="text" th:field="*{name}" class="form-control" required placeholder="Nhập tên...">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Giá bán (VNĐ)</label>
                            <input type="number" th:field="*{price}" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label fw-bold">Danh mục</label>
                            <select th:field="*{category.id}" class="form-select" required>
                                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Đặc điểm nổi bật (Mô tả)</label>
                        <textarea th:field="*{description}" class="form-control" rows="5"
                            placeholder="Ví dụ: Hoa hồng Đà Lạt, cành dài 50cm..."></textarea>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Hình ảnh minh họa</label>
                        <input type="file" name="imageFile" class="form-control" accept="image/png, image/jpeg">
                        <small class="text-muted">Bỏ trống nếu không muốn đổi ảnh cũ</small>
                    </div>

                    <button type="submit" class="btn btn-success w-100 fw-bold rounded-pill shadow-sm fs-5">LƯU SẢN
                        PHẨM</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
