<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thanh Toán - Cửa Hàng Hoa Xinh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
    <style>
        :root {
            --primary-color: #c2185b;
            --secondary-color: #ec407a;
            --light-bg: #fff3e0;
            --navy: #1a237e;
        }

        body {
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            background: linear-gradient(90deg, var(--navy) 0%, var(--primary-color) 100%);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
            color: white !important;
        }

        .checkout-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            margin-bottom: 25px;
        }

        .card-header {
            background: linear-gradient(90deg, var(--navy) 0%, var(--primary-color) 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            font-weight: bold;
            font-size: 1.1rem;
            padding: 20px;
        }

        .form-label {
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .form-control {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 12px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(194, 24, 91, 0.25);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .order-summary {
            background: linear-gradient(135deg, #fff9c4 0%, #fff59d 100%);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .order-summary h5 {
            color: var(--navy);
            font-weight: bold;
            margin-bottom: 15px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .summary-item .label {
            font-weight: 500;
            color: #333;
        }

        .summary-item .value {
            color: var(--primary-color);
            font-weight: 600;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            margin-top: 10px;
            border-top: 3px solid var(--primary-color);
            border-bottom: 3px solid var(--primary-color);
            font-size: 1.1rem;
        }

        .summary-total .label {
            font-weight: bold;
            color: var(--navy);
        }

        .summary-total .value {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 1.3rem;
        }

        .product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .product-item .product-info {
            flex: 1;
        }

        .product-item .product-name {
            font-weight: 500;
            color: #333;
            min-width: 150px;
        }

        .product-item .product-qty {
            color: #999;
            font-size: 0.9rem;
            margin: 0 10px;
        }

        .product-item .product-price {
            color: var(--primary-color);
            font-weight: 600;
            min-width: 100px;
            text-align: right;
        }

        .btn-submit {
            background: linear-gradient(90deg, var(--navy) 0%, var(--primary-color) 100%);
            color: white;
            border: none;
            padding: 14px 40px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(194, 24, 91, 0.3);
            color: white;
        }

        .btn-back {
            background: #f5f5f5;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            display: inline-block;
            font-weight: bold;
        }

        .btn-back:hover {
            background: var(--primary-color);
            color: white;
            text-decoration: none;
        }

        .step-indicator {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            padding: 0 20px;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .step-number {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(90deg, var(--navy) 0%, var(--primary-color) 100%);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .step.active .step-number {
            box-shadow: 0 0 0 4px rgba(194, 24, 91, 0.2);
        }

        .step.completed .step-number {
            background: linear-gradient(90deg, #4caf50 0%, #45a049 100%);
        }

        .step-label {
            font-size: 0.85rem;
            color: #666;
            font-weight: 500;
        }

        .step.active .step-label,
        .step.completed .step-label {
            color: var(--primary-color);
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .checkout-container {
                margin: 20px 10px;
            }

            .step-indicator {
                padding: 0;
            }

            .step-label {
                font-size: 0.7rem;
            }
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fas fa-flower me-2"></i>Cửa Hàng Hoa Xinh
            </a>
        </div>
    </nav>

    <div class="checkout-container">
        <!-- Step Indicator -->
        <div class="step-indicator">
            <div class="step completed">
                <div class="step-number"><i class="fas fa-shopping-cart"></i></div>
                <div class="step-label">Giỏ Hàng</div>
            </div>
            <div class="step active">
                <div class="step-number">2</div>
                <div class="step-label">Thanh Toán</div>
            </div>
            <div class="step">
                <div class="step-number"><i class="fas fa-check"></i></div>
                <div class="step-label">Xác Nhận</div>
            </div>
        </div>

        <div class="row">
            <!-- Checkout Form -->
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-user-circle me-2"></i>Thông Tin Giao Hàng
                    </div>
                    <div class="card-body">
                        <form th:action="@{/cart/checkout}" method="POST">
                            <div class="form-row">
                                <div>
                                    <label for="customerName" class="form-label">Họ và Tên</label>
                                    <input type="text" id="customerName" name="customerName" class="form-control"
                                        placeholder="Nhập họ và tên" required>
                                </div>
                                <div>
                                    <label for="customerPhone" class="form-label">Số Điện Thoại</label>
                                    <input type="tel" id="customerPhone" name="customerPhone" class="form-control"
                                        placeholder="Nhập số điện thoại" required pattern="[0-9]{10}">
                                </div>
                            </div>

                            <div class="form-row full">
                                <div>
                                    <label for="customerEmail" class="form-label">Email</label>
                                    <input type="email" id="customerEmail" name="customerEmail" class="form-control"
                                        th:value="${customerEmail}" readonly>
                                </div>
                            </div>

                            <div class="form-row full">
                                <div>
                                    <label for="customerAddress" class="form-label">Địa Chỉ Giao Hàng</label>
                                    <textarea id="customerAddress" name="customerAddress" class="form-control" rows="3"
                                        placeholder="Nhập địa chỉ giao hàng" required></textarea>
                                </div>
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn-submit">
                                    <i class="fas fa-credit-card me-2"></i>Xác Nhận Đơn Hàng
                                </button>
                                <a th:href="@{/cart}" class="btn-back text-center">
                                    <i class="fas fa-arrow-left me-2"></i>Quay Lại Giỏ Hàng
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Order Summary -->
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-list-check me-2"></i>Tóm Tắt Đơn Hàng
                    </div>
                    <div class="card-body">
                        <div class="order-summary">
                            <h5><i class="fas fa-shopping-bag me-2"></i>Sản Phẩm</h5>
                            <div th:each="item : ${cart}" class="product-item">
                                <div class="product-info">
                                    <div class="product-name" th:text="${item.productName}"></div>
                                </div>
                                <div class="product-qty" th:text="'x' + ${item.quantity}"></div>
                                <div class="product-price"
                                    th:text="${#numbers.formatInteger(item.price * item.quantity, 3, 'POINT')} + ' đ'">
                                </div>
                            </div>

                            <div class="summary-total mt-3">
                                <div class="label">Tổng Tiền:</div>
                                <div class="value" th:text="${#numbers.formatInteger(totalPrice, 3, 'POINT')} + ' đ'">
                                </div>
                            </div>

                            <div class="alert alert-info mt-3 mb-0">
                                <i class="fas fa-info-circle me-2"></i>
                                <strong>Lưu ý:</strong> Vui lòng kiểm tra lại thông tin giao hàng trước khi xác nhận
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Shipping Info -->
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-truck me-2"></i>Thông Tin Vận Chuyển
                    </div>
                    <div class="card-body">
                        <div class="summary-item">
                            <span class="label"><i class="fas fa-coins me-2"></i>Phí Vận Chuyển</span>
                            <span class="value">Miễn Phí</span>
                        </div>
                        <div class="summary-item">
                            <span class="label"><i class="fas fa-clock me-2"></i>Thời Gian Giao</span>
                            <span class="value">2-3 ngày</span>
                        </div>
                        <div class="summary-item">
                            <span class="label"><i class="fas fa-map-marker-alt me-2"></i>Phạm Vi</span>
                            <span class="value">Toàn TP.HCM</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
