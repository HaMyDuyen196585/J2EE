<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi Tiết Đơn Hàng - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
    <style>
        :root {
            --primary-pink: #c2185b;
            --secondary-rose: #e85d75;
            --light-bg: #fdf8f5;
        }

        body {
            background: var(--light-bg);
        }

        .navbar {
            background: linear-gradient(90deg, #1a237e, var(--primary-pink));
        }

        .navbar-brand {
            color: white !important;
            font-weight: bold;
        }

        .detail-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        .card-header-custom {
            background: linear-gradient(90deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 25px;
            border-bottom: 3px solid var(--primary-pink);
            border-radius: 15px 15px 0 0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .info-label {
            color: #999;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .info-value {
            color: var(--primary-pink);
            font-weight: 700;
        }

        .status-badge {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-confirmed {
            background: #d4edda;
            color: #155724;
        }

        .status-shipped {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-delivered {
            background: #d4edda;
            color: #155724;
        }

        .product-item {
            display: grid;
            grid-template-columns: 80px 1fr auto auto;
            gap: 15px;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .product-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 10px;
            background: #f5f5f5;
        }

        .product-name {
            font-weight: 600;
            color: var(--primary-pink);
        }

        .product-qty {
            color: #999;
        }

        .product-price {
            font-weight: 700;
            color: var(--secondary-rose);
        }

        .summary-box {
            background: linear-gradient(135deg, #fff9c4 0%, #fff59d 100%);
            padding: 25px;
            border-radius: 15px;
            margin-top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            padding-top: 15px;
            border-top: 3px solid var(--primary-pink);
            font-size: 1.3rem;
            color: var(--primary-pink);
        }

        .action-section {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .action-title {
            color: var(--primary-pink);
            font-weight: 700;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            font-weight: 600;
            color: var(--primary-pink);
            margin-bottom: 8px;
        }

        .form-select {
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 12px;
            transition: all 0.3s ease;
        }

        .form-select:focus {
            border-color: var(--primary-pink);
            box-shadow: 0 0 0 0.2rem rgba(194, 24, 91, 0.15);
        }

        .btn-confirm-order {
            background: linear-gradient(90deg, #4CAF50 0%, #43A047 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 700;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-confirm-order:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(76, 175, 80, 0.3);
            color: white;
        }

        .btn-confirm-order:disabled {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .btn-back {
            background: #f5f5f5;
            color: var(--primary-pink);
            border: 2px solid var(--primary-pink);
            padding: 12px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .btn-back:hover {
            background: var(--primary-pink);
            color: white;
        }

        .alert-message {
            border-radius: 10px;
            border: none;
            margin-bottom: 20px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/orders/admin/all}">
                <i class="fas fa-cogs me-2"></i>Admin Dashboard
            </a>
            <div class="ms-auto">
                <a th:href="@{/orders/admin/all}" style="color: white; text-decoration: none;">
                    <i class="fas fa-arrow-left me-2"></i>Quay Lại
                </a>
            </div>
        </div>
    </nav>

    <div class="container" style="margin: 30px auto; max-width: 900px;">
        <!-- Success/Error Messages -->
        <div th:if="${success}" class="alert alert-message alert-success" role="alert">
            <i class="fas fa-check-circle me-2"></i>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert alert-message alert-error" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span th:text="${error}"></span>
        </div>

        <!-- Order Header -->
        <div class="detail-card">
            <div class="card-header-custom">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <h3 style="color: var(--primary-pink); margin: 0;">
                            <i class="fas fa-box me-2"></i>Đơn Hàng #<span th:text="${order.id}"></span>
                        </h3>
                        <p class="text-muted mb-0 mt-2">
                            <i class="fas fa-calendar-alt me-2"></i>
                            <span th:text="${order.formattedDate}"></span>
                        </p>
                    </div>
                    <div class="col-md-4 text-end">
                        <span class="status-badge" th:classappend="${'status-' + order.status.name().toLowerCase()}"
                            th:text="${order.status.label}"></span>
                    </div>
                </div>
            </div>

            <div class="card-body" style="padding: 25px;">
                <!-- Customer Info -->
                <h5 style="color: var(--primary-pink); margin-bottom: 15px;">
                    <i class="fas fa-user me-2"></i>Thông Tin Khách Hàng
                </h5>
                <div class="info-row">
                    <span class="info-label">Họ Tên:</span>
                    <span class="info-value" th:text="${order.customerName}"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Email:</span>
                    <span class="info-value" th:text="${order.customerEmail}"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Số Điện Thoại:</span>
                    <span class="info-value" th:text="${order.customerPhone}"></span>
                </div>
                <div class="info-row" style="border-bottom: none;">
                    <span class="info-label">Địa Chỉ Giao:</span>
                    <span class="info-value" th:text="${order.customerAddress}"></span>
                </div>
            </div>
        </div>

        <!-- Products -->
        <div class="detail-card">
            <div class="card-header-custom">
                <h5 style="margin: 0; color: var(--primary-pink);">
                    <i class="fas fa-shopping-bag me-2"></i>Chi Tiết Sản Phẩm
                </h5>
            </div>

            <div class="card-body" style="padding: 25px;">
                <div th:each="detail : ${orderDetails}" class="product-item">
                    <img th:src="${detail.product.image}" class="product-img"
                        onerror="this.src='https://via.placeholder.com/80?text=Hoa';">
                    <div>
                        <div class="product-name" th:text="${detail.product.name}"></div>
                        <div class="product-qty" th:text="'Số lượng: ' + ${detail.quantity} + ' sản phẩm'"></div>
                    </div>
                    <div style="min-width: 100px; text-align: right;">
                        <div class="product-qty" th:text="${#numbers.formatInteger(detail.price, 3, 'POINT')} + ' đ'">
                        </div>
                    </div>
                    <div style="min-width: 120px; text-align: right;">
                        <div class="product-price"
                            th:text="${#numbers.formatInteger(detail.subtotal, 3, 'POINT')} + ' đ'"></div>
                    </div>
                </div>

                <!-- Summary -->
                <div class="summary-box">
                    <div class="summary-row">
                        <span>Tổng Sản Phẩm:</span>
                        <span th:text="${orderDetails.size()} + ' sản phẩm'"></span>
                    </div>
                    <div class="summary-row">
                        <span>Phí Vận Chuyển:</span>
                        <span>Miễn Phí</span>
                    </div>
                    <div class="summary-total">
                        <span>TỔNG TIỀN:</span>
                        <span th:text="${#numbers.formatInteger(order.totalAmount, 3, 'POINT')} + ' đ'"></span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Update Status (Admin Only) -->
        <div th:if="${order.status.name() != 'CANCELLED'}" class="action-section">
            <h5 class="action-title">
                <i class="fas fa-tasks me-2"></i>Cập Nhật Trạng Thái
            </h5>

            <form th:action="@{/orders/admin/{id}/status(id=${order.id})}" method="POST">
                <div class="form-group">
                    <label for="status" class="form-label">Chọn Trạng Thái Mới:</label>
                    <select id="status" name="status" class="form-select" required>
                        <option value="">-- Chọn Trạng Thái --</option>
                        <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.label}"
                            th:disabled="${s.name() == order.status.name()}"></option>
                    </select>
                </div>

                <button type="submit" class="btn-confirm-order">
                    <i class="fas fa-save me-2"></i>Cập Nhật Trạng Thái
                </button>
            </form>
        </div>

        <!-- Back Button -->
        <div class="text-center mt-4 mb-5">
            <a th:href="@{/orders/admin/all}" class="btn-back">
                <i class="fas fa-arrow-left me-2"></i>Quay Lại Danh Sách
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
